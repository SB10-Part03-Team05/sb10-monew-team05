name: Dokcer 이미지 build 및 push & ECS service 업데이트

on: # workflow 실행 조건
  push:
    branches: [ "cd/deploy" ]  # 테스트 용
#    branches: [ "dev" ]  # dev branch에서 push(merge 포함) 이벤트 발생될 때만 실행

jobs: # 실행할 작업
  # 1. Docker 이미지 build 및 push Job
  docker-images-build-and-push:
    runs-on: ubuntu-latest  # 실행환경

    # 작업 결과(output)를 다른 작업(Job)에서 사용할 수 있게 설정
    outputs:
      image_tag: ${{ steps.prep.outputs.image_tag }}

    # 작업에서 자동으로 발급되는 `GITHUB_TOKEN`의 권한 범위 제한
    permissions:
      contents: read  # 읽기

    steps: # 작업 단계
      # 1-1) 현재 repo의 소스코드를 checkout(가져옴)
      - name: Checkout
        uses: actions/checkout@v6

      # 1-2) JDK 설정
      - name: JDK 17 설정
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # 1-3) Gradle 캐시
      # GitHub Actions가 Gradle build를 더 빠르게 하도록 Gradle 관련 캐시를 설정하여
      # 매번 CI/CD 실행 시 의존성이나 Gradle 관련 상태를 처음부터 다시 받지 않도록,
      # 이전에 내려받은 것들을 저장했다가 다시 재사용
      - name: Gradle 캐시
        uses: gradle/actions/setup-gradle@v5

      # 1-4) Gradle 실행 권한 설정
      - name: 실행 권한 부여
        run: chmod +x gradlew
        # `chmod` : 파일 권한 변경하는 Linux 명령어
        # `+x` : `chmod` 와 함께 사용하여 실행 권한을 추가하는 명령어

      # 1-5) 애플리케이션 build (`JAR` 파일 생성)
      - name: build JAR
        run: ./gradlew clean bootJar

      # 1-6) AWS CLI 설정
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: us-east-1

      # 1-7) Public ECR 로그인
      - name: Public ECR 로그인
        run: |
          aws ecr-public get-login-password --region us-east-1 \
          | docker login --username AWS --password-stdin public.ecr.aws

      # 1-8) Docker 이미지 tag 구성 (+커밋 해시)
      # `id` : 이름표를 붙여서 나중에 참조할 때 사용
      # `echo ... >> "GITHUB_OUTPUT"` : 현재 step에서 만든 값(output)을 다른 step이나 job에서 참조할 수 있게 저장
      - name: Prepare 이미지 tags
        id: prep
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "REPO_URI=${{ vars.ECR_REPOSITORY_URI }}" >> "$GITHUB_ENV"
          echo "image_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      # 1-9) Docker build
      # tag = 커밋 해시 + lastest
      - name: Docker build
        run: |
          docker build \
          -t "$REPO_URI:$IMAGE_TAG" \
          -t "$REPO_URI:latest" \
          .

      # 1-10) ECR push
      - name: Docker push
        run: |
          docker push "$REPO_URI:$IMAGE_TAG"
          docker push "$REPO_URI:latest"

  # 2. ECS service에 새 이미지 업데이트
  ecs-service-update:
    runs-on: ubuntu-latest
    needs: docker-images-build-and-push

    permissions:
      contents: read

    steps:
      # 2-1) AWS CLI 설정
      # region은 ECS cluster가 있는 region
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      # 2-2) 현재 ECS task definition을 JSON 파일로 다운로드
      # `--task-definition` : 조회할 task definition 이름(family) 또는 ARN 지정
      # `--query taskDefinition` : 응답 전체 중 `taskDefinition` 부분만 꺼냄
      # `> task-definition.json` : 조회 결과를 `task-definition.json` 파일에 저장
      - name: 현재 task definition 다운로드
        run: |
          aws ecs describe-task-definition \
          --task-definition ${{ vars.ECS_TASK_DEFINITION }} \
          --query taskDefinition > task-definition.json

      # 2-3) 위에서 다운로드한 task definition JSON에서 컨테이너 이미지 URI만 새 이미지로 교체
      - name: task definition에 새 이미지 반영
        id: task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ vars.ECS_CONTAINER }}
          image: ${{ vars.ECR_REPOSITORY_URI }}:${{ needs.docker-images-build-and-push.outputs.image_tag }}

      # 2-4) 기존에 구동 중인 ECS service 중단
      # `--desired-count` : 서비스가 유지하려고 하는 task 개수
      # `--desired-count 0`이면 실행 중인 task 수를 0개로 맞춤 (모두 중지)
      - name: 기존 ECS service 중지
        run: |
          aws ecs update-service \
          --cluster ${{ vars.ECS_CLUSTER }} \
          --service ${{ vars.ECS_SERVICE }} \
          --desired-count 0

      # 2-5) 새 이미지가 반영된 task definition으로 ECS service 업데이트
      # `task-definition` : 위 step에서 새 이미지가 반영된 task definition 정의 파일
      # `wait-for-service-stability` : 배포 후 service가 안정 상태가 될 때까지 기다림
      - name: ECS service 업데이트
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-definition.outputs.task-definition }}
          cluster: ${{ vars.ECS_CLUSTER }}
          service: ${{ vars.ECS_SERVICE }}
          wait-for-service-stability: true

      # 2-6) 컨테이너를 다시 실행하여 ECS service 다시 실행
      - name: ECS service 다시 시작
        run: |
          aws ecs update-service \
          --cluster ${{ vars.ECS_CLUSTER }} \
          --service ${{ vars.ECS_SERVICE }} \
          --desired-count 1
