services:
  app:
    image: monew:local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: monew-server
    ports:
      - "8080:80"
    environment:
      - SERVER_PORT=80
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      # DB 설정 (아래 db 서비스와 연결, 나중에 RDS로 전환 예정)
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=5432
      - DB_NAME=${DB_NAME}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      # MongoDB 설정
      - MONGO_USER=${MONGO_USER}
      - MONGO_PASSWORD=${MONGO_PASSWORD}
      - MONGO_PROTO=${MONGO_PROTO:-mongodb}
      - MONGO_HOST=${MONGO_HOST:-mongodb}
      - MONGO_DB=${MONGO_DB}
      - MONGO_RETRY_WRITES=${MONGO_RETRY_WRITES:-false}
      # AWS 설정
      - AWS_ACCESS_KEY=${AWS_ACCESS_KEY}
      - AWS_SECRET_KEY=${AWS_SECRET_KEY}
      - AWS_REGION=${AWS_REGION}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      - AWS_S3_PRESIGNED_URL_EXPIRATION=${AWS_S3_PRESIGNED_URL_EXPIRATION}
      # 네이버 설정
      - NAVER_CLIENT_ID=${NAVER_CLIENT_ID}
      - NAVER_CLIENT_SECRET=${NAVER_CLIENT_SECRET}

    depends_on:
      - db # RDS 전환 시 주석 처리 또는 삭제하세요.
      - mongodb
    volumes:
      - ./.logs:/app/.logs
    networks:
      - monew-network

  # ---------------------------------------------------------
  # [PostgreSQL 로컬 컨테이너]
  # RDS 세팅 완료 후에는 이 'db' 서비스 블록 전체를 주석 처리하거나 삭제하세요.
  # ---------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: monew-db
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - monew-postgres-data:/var/lib/postgresql/data
      - ./src/main/resources/schema-postgre.sql:/docker-entrypoint-initdb.d/init-schema.sql:ro
    networks:
      - monew-network

  # ---------------------------------------------------------
  # [MongoDB 로컬 컨테이너]
  # ---------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: monew-mongodb
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}     # 초기 루트 계정
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD} # 초기 루트 비밀번호
      - MONGO_INITDB_DATABASE=${MONGO_DB}             # 초기 생성 데이터베이스
    ports:
      - "27017:27017"
    volumes:
      - monew-mongodb-data:/data/db
      - monew-mongodb-config:/data/configdb
    networks:
      - monew-network

  # ---------------------------------------------------------
  # [Prometheus 컨테이너]
  # Spring 앱의 /actuator/prometheus 경로에서 주기적으로 지표 수집
  # ---------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: monew-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    extra_hosts:
      - "host.docker.internal:host-gateway" # 도커 컨테이너가 호스트 OS를 인식할 수 있도록 설정
    networks:
      - monew-network

  # ---------------------------------------------------------
  # [Grafana 컨테이너]
  # 수집된 시계열 데이터를 시각화하는 대시보드 제공
  # ---------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: monew-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - monew-grafana-data:/var/lib/grafana
    networks:
      - monew-network
    depends_on:
      - prometheus

volumes:
  monew-postgres-data: # RDS로 전환 시 볼륨도 필요없으므로 주석 처리 또는 삭제하세요.
  monew-mongodb-data:
  monew-mongodb-config:
  monew-grafana-data:

networks:
  monew-network:
    driver: bridge